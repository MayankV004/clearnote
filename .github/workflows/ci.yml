name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Lint, type-check, and audit frontend code
  frontend-ci:
    name: "Frontend — Lint, Typecheck & Audit"
    runs-on: ubuntu-22.04
    steps:
      # Checkout the repository code
      - uses: actions/checkout@v4

      # Setup Node.js with npm cache
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      # Install frontend dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      # Run ESLint
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      # Run TypeScript type check
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        working-directory: ./frontend

      # Audit npm dependencies for vulnerabilities
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: ./frontend
        continue-on-error: true

  # Syntax check and audit backend dependencies
  backend-ci:
    name: "Backend — Syntax Check & Audit"
    runs-on: ubuntu-22.04
    steps:
      # Checkout the repository code
      - uses: actions/checkout@v4

      # Setup Python with pip cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install uv so the lockfile can be exported to requirements.txt
      - name: Install uv
        run: python -m pip install uv
        working-directory: ./backend

      # Export locked backend dependencies from uv.lock
      - name: Export backend requirements
        run: uv export --frozen --no-dev --format requirements.txt --output-file requirements.txt
        working-directory: ./backend

      # Install backend dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      # Install pip-audit for vulnerability scanning
      - name: Install pip-audit
        run: pip install pip-audit

      # Audit pip dependencies for vulnerabilities
      - name: Audit pip dependencies
        run: pip-audit
        continue-on-error: true

      # Check Python files for syntax errors
      - name: Check Python syntax
        run: find . -name "*.py" -not -path "./.venv/*" | xargs python3 -m py_compile && echo "All Python files passed syntax check"
        working-directory: ./backend
